<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Admin Details</title>
  <link rel="stylesheet" href="./CSS/update.css">
</head>
<body>
  <div class="container">
    <h1>Update Your Details <b>(Admin)</b></h1>
    <form id="updateForm">
      <input type="hidden" id="admId">

      <label for="fname">First Name</label>
      <input type="text" id="fname" name="fname" required>

      <label for="lname">Last Name</label>
      <input type="text" id="lname" name="lname" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required disabled>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>

      <label for="address">Address</label>
      <input type="text" id="address" name="address" required>

      <label for="mobileNumber">Mobile Number</label>
      <input type="text" id="mobileNumber" name="mobileNumber" required>

      <label for="imageInput">Update Image (optional)</label>
      <input type="file" id="imageInput" accept="image/*">
      <img id="imagePreview" src="" alt="Preview" style="width: 100px; margin-top: 10px;">

      <button type="submit">Update</button>
    </form>
  </div>

  <!-- Popup Modal -->
  <div id="messageModal" class="modal-overlay hidden">
    <div class="modal-box">
      <p id="messageText"></p>
      <div class="modal-buttons" style="justify-content: center;">
        <button id="messageCloseBtn">OK</button>
      </div>
    </div>
  </div>

  <script src="./JavaScript/updateDetailsAdmin.js"></script>
  <script src="./JavaScript/popup.js"></script>
</body>
</html>
