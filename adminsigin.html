<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin SignIn Page</title>
  <link rel="stylesheet" href="./CSS/adminsignin.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

<header>
  <nav>
  <ul class="left-nav">
    <li class="home-icon">
      <a href="index.html"><i class="fas fa-home"></i></a>
    </li>
    <li><h1 id="welcome-msg">Student-Course Application Admin-SignIn</h1></li>
  </ul>

  <ul id="action-btns">
    <li class="search-container"><input type="text" placeholder="Search..."></li>
    <li><a href="signup.html"><button class="btn signup"><i class="fas fa-user-plus"></i> Sign Up as student</button></a></li>
    <li><a href="signin.html"><button class="btn admin"><i class="fas fa-user-shield"></i> sign in as student</button></a></li>
    <!-- <li class="user-icon"><img src="https://static.vecteezy.com/system/resources/previews/019/879/186/original/user-icon-on-transparent-background-free-png.png" alt="User" height="30" width="50"/></li> -->
  </ul>
</nav>

</header>

    <form id="signinForm">
  <legend>Admin Sign In</legend>
  <p id="loginErrorMsg" style="color: red;"></p>
  <div id="loginErrorMsg" style="color: red; margin-top: 10px;"></div>
  <label for="email">Email</label>
  <input type="email" id="email" name="email" required placeholder="Enter Your Email">

  <!-- Password -->
  <label for="password">Password</label>
  <div class="password-container">
    <input type="password" id="password" name="password" required placeholder="Enter Password">
    <i id="togglePassword" class="fas fa-eye toggle-eye"></i>
  </div>

  <!-- Confirm Password -->
  <label for="confirmPassword">Confirm Password</label>
  <div class="password-container">
    <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Re-enter Password">
    <i id="toggleConfirmPassword" class="fas fa-eye toggle-eye"></i>
  </div>
  <section class="passcrrtornotsec">
      <p id="validationnotcrrt"></p>
      <p style="color: red;" id="passcrrtornot"></p>
      <button id='reset' onclick='resetpage()' type='reset' style="display: none;">ok</button>
  </section>

  <!-- <label for="otp">Enter the number shown below:</label>
  <div id="randomNumber" class="otp-display"></div>
  <input type="text" id="otpInput" placeholder="Enter above number" required> -->
  <label for="otp">Enter the number shown below:</label>
<div style="display: flex; align-items: center; gap: 10px;">
  <div id="randomNumber" class="otp-display" style="font-weight: bold; font-size: 18px;"></div>
  <button type="button" onclick="regenerateOTP()">🔄Refresh</button>
</div>
<input type="text" id="otpInput" placeholder="Enter above number" required>
<p id="otpMatchOrNot" style="color: red; margin-top: 5px;"></p>

  <button type="submit">Sign In</button>
  <p>New User.To register please click on <span><a href="./adminSignUp.html">SignUp</a></span></p>
  <p>forgot password please <span><a href="./forgotpasswordAdmin.html">Click Here</a></span></p>

</form>

<!-- Message Modal -->
<div id="messageModal" class="modal hidden">
  <div class="modal-content">
    <span id="messageText"></span><br><br>
    <button id="messageCloseBtn" class="btn">OK</button>
  </div>
</div>

</body>
  <script src="./JavaScript/adminsignin.js"></script>
</html>
