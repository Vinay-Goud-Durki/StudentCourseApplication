<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./CSS/forgotPassword.css" />
</head>
<body>
  <div class="fp-container">
    <h2>Forgot Password-Admin</h2>
    <!-- Enter Email -->
    <form id="emailForm" class="fp-form">
      <label for="fpEmail">Enter your registered email</label>
      <input type="email" id="fpEmail" required placeholder="Email" />
      <button type="submit" id="sendOtpBtn">Send OTP</button>
    </form>

    <!-- OTP Verification (hidden by default) -->
    <form id="otpForm" class="fp-form hidden">
      <label for="fpOtp">Enter the OTP sent to your email</label>
      <input type="text" id="fpOtp" maxlength="6" required placeholder="Enter OTP" />
      <button type="button" id="verifyOtpBtn">Verify OTP</button>
      <button type="button" id="resendOtpBtn" class="secondary">Resend OTP</button>
    </form>

    <!-- Password Reset (hidden by default) -->
    <form id="resetForm" class="fp-form hidden">
      <label for="newPassword">Create New Password</label>
      <input type="password" id="newPassword" required placeholder="New Password" />
      <label for="confirmPassword">Confirm New Password</label>
      <input type="password" id="confirmPassword" required placeholder="Confirm Password" />
      <button type="submit" id="resetPasswordBtn">Reset Password</button>
    </form>
  </div>

  <!-- Popup Modal -->
  <div id="fpMessageModal" class="fp-modal-overlay hidden">
    <div class="fp-modal-box">
      <p id="fpMessageText"></p>
      <div class="fp-modal-buttons">
        <button id="fpMessageCloseBtn">OK</button>
      </div>
    </div>
  </div>

  <script src="./JavaScript/forgotPasswordAdmin.js"></script>
</body>
</html>
